<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121316">
<title>自分 - RaeBlox</title>
<style>
  :root { --bg: #121316; --card: #25262c; --line: #3a3b44; --text: #fff; --sub: #b9bac4; --accent: #c4b5fd; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); overscroll-behavior: none; font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .app { display: flex; height: 100%; height: 100dvh; }

  /* 左: パーツ一覧 */
  .list { flex: 1 1 58%; min-width: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-left: env(safe-area-inset-left); }
  .top { display: flex; align-items: center; gap: 12px; padding: 12px 18px 0; }
  .back { color: var(--sub); text-decoration: none; font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--card); }
  .top h1 { margin: 0; font-size: 18px; }
  .cats { display: flex; gap: 22px; padding: 10px 22px 0; border-bottom: 1px solid var(--line); }
  .cat { border: 0; background: none; padding: 10px 2px 12px; font-size: 17px; font-weight: 700; color: var(--sub); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .cat.on { color: var(--text); border-bottom-color: var(--text); }
  .subs { display: flex; gap: 8px; padding: 12px 20px 4px; overflow-x: auto; scrollbar-width: none; }
  .subs::-webkit-scrollbar { display: none; }
  .sub { flex: none; border: 0; border-radius: 999px; padding: 7px 16px; background: var(--card); color: var(--sub); font-weight: 600; font-size: 14px; }
  .sub.on { background: var(--text); color: #121316; }
  .sets { display: flex; align-items: center; gap: 8px; padding: 4px 20px 0; overflow-x: auto; scrollbar-width: none; }
  .sets::-webkit-scrollbar { display: none; }
  .sets .lbl { flex: none; font-size: 12px; font-weight: 700; color: var(--sub); }
  .chip { flex: none; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 20px 28px; -webkit-overflow-scrolling: touch; }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 12px; }
  .head-row h2 { margin: 0; font-size: 20px; }
  .bulk { display: flex; gap: 8px; }
  .bulk button { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .bulk button:active { background: var(--card); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 14px; }
  .card { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 6px; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 14px; background: var(--card); display: grid; place-items: center; overflow: hidden; border: 3px solid transparent; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb .ph { width: 38%; height: 58%; border-radius: 8px; background: #8b8c96; opacity: .6; }
  .card.on .thumb { border-color: var(--accent); }
  .card.on .thumb::after { content: "✓"; position: absolute; right: 7px; top: 7px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #1e1b4b; font-weight: 800; font-size: 14px; display: grid; place-items: center; }
  .slot { font-size: 12px; font-weight: 700; color: var(--accent); }
  .name { font-size: 14px; font-weight: 600; line-height: 1.3; word-break: break-word; }
  .empty { grid-column: 1 / -1; padding: 40px 0; text-align: center; color: var(--sub); white-space: pre-wrap; }

  /* 右: アバター */
  .preview { position: relative; flex: 0 0 42%; min-width: 0; background: linear-gradient(180deg, #d8b9c9 0%, #f1d4c5 62%, #e6c4ad 100%); }
  #stage { position: absolute; inset: 0; }
  .tools { position: absolute; left: 14px; top: calc(14px + env(safe-area-inset-top)); z-index: 3; display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 999px; background: rgba(24, 24, 28, .86); }
  .tools button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: none; font-size: 24px; line-height: 1; }
  .tools button:disabled { opacity: .3; cursor: default; }
  .tools button:not(:disabled):active { background: rgba(255, 255, 255, .14); }
  .hint { position: absolute; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 3; margin: 0; text-align: center; font-size: 12px; color: #3d2b3a; text-shadow: 0 1px 0 rgba(255,255,255,.5); pointer-events: none; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; max-width: 90vw; padding: 10px 16px; border-radius: 10px; background: rgba(40, 40, 48, .95); font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 760px) { /* 縦長: アバターを上、一覧を下 */
    .app { flex-direction: column; }
    .preview { order: -1; flex: 0 0 40%; }
    .list { padding-left: 0; padding-top: 0; }
    .tools { flex-direction: row; top: auto; bottom: 12px; left: 12px; }
    .hint { bottom: 12px; left: 140px; text-align: left; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app">
  <section class="list">
    <header class="top"><a class="back" href="../">← ホーム</a><h1>自分</h1></header>
    <nav class="cats" aria-label="カテゴリ"><button class="cat on" type="button">ボディ</button></nav>
    <nav class="subs" id="subs" aria-label="部位"></nav>
    <nav class="sets" id="sets" aria-label="セット"></nav>
    <div class="scroll">
      <div class="head-row">
        <h2>ボディパーツ</h2>
        <div class="bulk"><button type="button" id="allOn">全部つける</button><button type="button" id="allOff">全部外す</button></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
  <section class="preview">
    <div id="stage"></div>
    <div class="tools">
      <button type="button" id="undo" aria-label="元に戻す" disabled>↶</button>
      <button type="button" id="redo" aria-label="やり直す" disabled>↷</button>
    </div>
    <p class="hint" id="hint"></p>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./me.js"></script>
</body>
</html>
