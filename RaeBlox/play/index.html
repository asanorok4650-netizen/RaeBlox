<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111116">
<title>RaeBlox - プレイ</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111116; overscroll-behavior: none; font-family: "Noto Sans JP", system-ui, sans-serif; color: #fff; }
  #stage { position: fixed; inset: 0; }
  .back { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 30; padding: 8px 14px; border-radius: 999px; background: rgba(17,17,22,.72); color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; backdrop-filter: blur(6px); }
  .overlay { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center; background: #111116; padding: 24px; transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h1 { margin: 0 0 8px; font-size: 20px; }
  .overlay p { margin: 0; color: #b9b9c6; font-size: 14px; white-space: pre-wrap; }
  .overlay a { color: #c4b5fd; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; padding: 10px 16px; border-radius: 10px; background: rgba(17,17,22,.85); font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
} }
</script>
</head>
<body>
<div id="stage"></div>
<a class="back" href="../" id="backLink">← ホームへ</a>
<div class="overlay" id="overlay"><div><h1 id="overlayTitle">読み込み中…</h1><p id="overlayText"></p></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./runtime.js"></script>
</body>
</html>
