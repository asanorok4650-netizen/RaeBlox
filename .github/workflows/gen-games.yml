name: Generate games manifest

on:
  push:
    branches: [main]
    paths:
      - 'RaeBlox/play/games/*/**'
      - 'RaeBlox/scripts/gen-games.mjs'
  workflow_run:            # ZIP自動展開(Auto Unzip)のコミットは push を発火させないため、完了後にも実行する
    workflows: ['Auto Unzip']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node RaeBlox/scripts/gen-games.mjs
      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RaeBlox/play/games/manifest.js
          git diff --staged --quiet || (git commit -m "Update games manifest" && git push)
